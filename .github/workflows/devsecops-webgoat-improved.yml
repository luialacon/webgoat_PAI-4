name: PAI-4 DevSecOps WebGoat (Mejorado)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-static-security:
    name: Build, Secretos, SAST, SCA e IaC (Gate A - Aviso)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente (historial completo para secretos)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 y compilar con Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar aplicación WebGoat
        run: mvn package -DskipTests -Dmaven.compiler.release=21

      - name: Construir imagen Docker de WebGoat
        run: docker build -t webgoat-local:pai4 .

      - name: Guardar imagen Docker para la etapa de pruebas
        run: |
          mkdir -p /tmp/docker-image
          docker save webgoat-local:pai4 -o /tmp/docker-image/webgoat-local.tar

      - name: Subir imagen Docker como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: webgoat-docker-image
          path: /tmp/docker-image/webgoat-local.tar
          retention-days: 1

      - name: Escaneo de Secretos con Gitleaks (Gate A - Modo Aviso)
        continue-on-error: true
        # Se ejecuta el binario oficial (versión fijada) porque la acción
        # gitleaks-action@v2 ignora 'args' y no genera gitleaks.json.
        # Analiza TODO el historial (fetch-depth: 0). Umbral: cualquier secreto => exit 1.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks/config.toml \
            --redact --report-format json --report-path gitleaks.json --exit-code 1

      - name: SAST con Semgrep (Gate A - Modo Aviso)
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config auto --severity ERROR --error --json -o semgrep-report.json .

      - name: SCA con Trivy sobre dependencias Maven (Gate A - Modo Aviso)
        continue-on-error: true
        # Cambio de diseño: OWASP Dependency-Check exige descargar la base NVD
        # (muy lenta o fallida sin clave API) y su contenedor es incompatible con
        # el JAVA_HOME del runner. Trivy fs analiza pom.xml contra su base de CVE.
        # Umbral: dependencias con severidad CRITICAL o HIGH => exit 1.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'json'
          output: 'trivy-sca-report.json'

      - name: Preparar Dockerfile_desktop para el análisis IaC
        # Trivy solo reconoce nombres Dockerfile, Dockerfile.* o *.Dockerfile.
        # Se copia (solo en el runner) para que Dockerfile_desktop también se analice.
        run: cp Dockerfile_desktop Dockerfile.desktop

      - name: Seguridad IaC con Trivy Config (Gate A - Modo Aviso)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'json'
          output: 'trivy-iac-report.json'

      - name: Subir informes de etapa Build / Estático
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-static-reports
          path: |
            gitleaks.json
            semgrep-report.json
            trivy-sca-report.json
            trivy-iac-report.json

  staging-image-and-dast:
    name: Escaneo de Imagen, Staging y DAST (Gate B - Bloqueante)
    needs: build-and-static-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Descargar y cargar imagen Docker de WebGoat
        uses: actions/download-artifact@v4
        with:
          name: webgoat-docker-image
          path: /tmp/docker-image

      - name: Cargar imagen en el daemon Docker del runner
        run: docker load -i /tmp/docker-image/webgoat-local.tar

      - name: Escaneo de Vulnerabilidades en Imagen Docker con Trivy (Modo Aviso)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: 'webgoat-local:pai4'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'json'
          output: 'trivy-img-report.json'

      - name: Arrancar WebGoat en contenedor para pruebas dinámicas
        run: |
          docker run -d --name webgoat-staging -p 8080:8080 webgoat-local:pai4
          echo "Esperando a que WebGoat inicie..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/WebGoat/login > /dev/null; do sleep 3; done'

      - name: DAST con OWASP ZAP (Gate B - Bloqueante)
        run: |
          mkdir -p "$(pwd)/zap-out"
          chmod 777 "$(pwd)/zap-out"
          docker run --rm --network host \
            -v "$(pwd)/zap-out:/zap/wrk:rw" \
            -v "$(pwd)/.zap/rules.tsv:/zap/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080/WebGoat \
            -c /zap/rules.tsv \
            -x zap-report.xml

      - name: Guardar informes de Imagen y DAST (siempre, aunque Gate B bloquee)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-dast-reports
          path: |
            trivy-img-report.json
            zap-out/zap-report.xml

  import-to-defectdojo:
    name: Importar Informes a DefectDojo (if always)
    needs: [build-and-static-security, staging-image-and-dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los informes generados
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports'

      - name: Enviar informes a DefectDojo vía API REST
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENG: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          UPLOADED=0
          # Comprobación previa: no se imprime nunca la URL (puede ser un túnel temporal).
          PRE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "Authorization: Token $DD_KEY" "$DD_URL/api/v2/user_profile/" 2>/dev/null || true)
          if [ "$PRE" != "200" ]; then
            echo "::error::DefectDojo no accesible (HTTP '$PRE'). Si se usa un túnel rápido de Cloudflare, actualizar el secreto DEFECTDOJO_URL."
            exit 1
          fi

          upload_scan() {
            local SCAN_TYPE="$1"
            local REPORT_PATH="$2"
            local TITLE="$3"
            if [ -f "$REPORT_PATH" ]; then
              echo "Subiendo $REPORT_PATH ($SCAN_TYPE) a DefectDojo..."
              CODE=$(curl -s -o /tmp/dd-response.txt -w "%{http_code}" -X POST "$DD_URL/api/v2/import-scan/" \
                -H "Authorization: Token $DD_KEY" \
                -F "engagement=$DD_ENG" \
                -F "scan_type=$SCAN_TYPE" \
                -F "test_title=$TITLE" \
                -F "file=@$REPORT_PATH" \
                -F "active=true" \
                -F "verified=false" \
                -F "commit_hash=$COMMIT_SHA" \
                -F "branch_tag=$BRANCH_NAME" \
                -F "build_id=$RUN_ID" 2>/dev/null || true)
              if [ "$CODE" = "201" ]; then
                UPLOADED=$((UPLOADED+1))
                echo "  OK (HTTP 201)"
              else
                echo "::warning::Fallo al importar $REPORT_PATH (HTTP '$CODE')"
                head -c 300 /tmp/dd-response.txt 2>/dev/null || true; echo ""
              fi
            else
              echo "::warning::No existe $REPORT_PATH, se omite."
            fi
          }

          upload_scan "Gitleaks Scan" "build-static-reports/gitleaks.json" "Gitleaks - Secretos"
          upload_scan "Semgrep JSON Report" "build-static-reports/semgrep-report.json" "Semgrep - SAST"
          upload_scan "Trivy Scan" "build-static-reports/trivy-sca-report.json" "Trivy - SCA dependencias"
          upload_scan "Trivy Scan" "build-static-reports/trivy-iac-report.json" "Trivy - IaC Dockerfile"
          upload_scan "Trivy Scan" "staging-dast-reports/trivy-img-report.json" "Trivy - Imagen Docker"
          upload_scan "ZAP Scan" "staging-dast-reports/zap-out/zap-report.xml" "OWASP ZAP - DAST"

          echo "Informes enviados a DefectDojo: $UPLOADED de 6 esperados"
          if [ "$UPLOADED" -lt 6 ]; then
            echo "::error::Faltan informes: solo se enviaron $UPLOADED de 6."
            exit 1
          fi
